<div class="text-center">
  @if (blobUrl()) {
    <div class="border rounded p-1 mb-2 mw-100">
      <img [src]="blobUrl()" class="rounded mw-100"/>
    </div>
  }

  @if (blobUrl()) {
    <button type="button" (click)="run()" class="btn btn-outline-primary btn-lg mx-1">Apply Converter</button>
    <button type="button" (click)="save()" class="btn btn-primary btn-lg mx-1">Save Conversion Result</button>
  } @else {
    <button type="button" (click)="run()" class="btn btn-primary btn-lg">Apply Converter</button>
  }
</div>
