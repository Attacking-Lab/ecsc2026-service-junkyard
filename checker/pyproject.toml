[project]
name = "checker"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "enochecker3~=0.22.3",
  "httpx>=0.28.1",
  "numpy>=2.5.1",
  "pillow>=12.3.0",
  "z3-solver>=5.1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv]
package = true

# enochecker_cli still hard-pins enochecker_core==0.10.0, which conflicts with
# enochecker3's version. Force the pinned version everywhere instead.
override-dependencies = [
  "enochecker-core @ git+https://github.com/attacking-lab/enochecker-core@v0.22.0"
]

[dependency-groups]
dev = [
  "enochecker-cli",
  "enochecker-test",
  "mypy>=2.3.1",
]

[tool.uv.sources]
enochecker-cli = { git = "https://github.com/attacking-lab/enochecker-cli", rev = "v0.22.0-public" }
enochecker-test = { git = "https://github.com/attacking-lab/enochecker-test", rev = "v0.22.0-public" }
enochecker-core = { git = "https://github.com/attacking-lab/enochecker-core", rev = "v0.22.0" }
enochecker3 = { git = "https://github.com/attacking-lab/enochecker3", rev = "v0.22.3-public" }

# RUN CHECKS:
# uv run enochecker_test -a localhost -p 8000 -A localhost
# uv run enochecker_test -n checker_junkyard_default -p 8000 -N service_default --flag-regex 'ECSC\{[A-Za-z0-9_-]{32}\}'

[tool.mypy]
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["z3", "z3.*"]
ignore_missing_imports = true
